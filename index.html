<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090e1b">
<title>DeepSeek AI 数字人</title>
<style>
:root{color-scheme:dark;--bg:#090e1b;--panel:rgba(15,23,42,.82);--line:rgba(255,255,255,.1);--muted:#9aa8bd;--green:#10b981}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}
.app{position:relative;height:100dvh;min-height:520px;overflow:hidden;background:radial-gradient(ellipse at 50% 28%,#233451 0%,#101a2c 38%,#090e1b 78%);display:flex;flex-direction:column}
.glow{position:absolute;width:270px;height:270px;border-radius:50%;background:#0ea5e9;filter:blur(100px);opacity:.12;left:50%;top:18%;transform:translateX(-50%);pointer-events:none}
.top{z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 13px) 16px 8px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.brand-mark{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#10b981,#0ea5e9);box-shadow:0 5px 20px #0ea5e944}
.status{font-size:11px;color:#b9c7d9;background:#111d30;border:1px solid var(--line);padding:7px 10px;border-radius:99px}
.creator-link{border:1px solid rgba(16,185,129,.35);border-radius:999px;background:#063d3555;color:#6ee7b7;padding:7px 10px;font-size:11px;margin-left:auto;margin-right:8px}.status:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#f59e0b;margin-right:6px}
.status.online:before{background:#34d399}
.stage{position:relative;flex:1;min-height:235px;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;position:absolute;inset:0}
.hint{position:absolute;bottom:48px;left:16px;right:16px;text-align:center;color:#aab8cb;font-size:12px;pointer-events:none}.avatar-actions{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:2}.avatar-action{border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(10,20,36,.78);backdrop-filter:blur(10px);color:#d7e4f4;padding:7px 11px;font-size:11px}.avatar-action.active{border-color:#10b981;color:#6ee7b7;background:#063d35aa}
.chat{z-index:2;margin:0 12px 10px;height:min(31vh,245px);min-height:125px;overflow:auto;overscroll-behavior:contain;padding:12px;border:1px solid var(--line);border-radius:20px;background:rgba(8,14,27,.65);backdrop-filter:blur(16px)}
.chat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;color:#aab8cb;font-size:11px}
.clear{border:0;background:transparent;color:#8da0b8;font-size:11px;padding:5px}
.msg{display:flex;margin:8px 0;gap:7px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.bubble{max-width:86%;padding:9px 12px;border-radius:15px;background:#17243a;color:#e7eef8;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.user .bubble{background:#075d50}
.avatar-mini{width:23px;height:23px;border-radius:8px;display:grid;place-items:center;background:#18334a;font-size:12px;flex:none}
.composer{z-index:3;padding:0 12px calc(env(safe-area-inset-bottom) + 12px)}
.tools{display:flex;gap:8px;margin-bottom:8px}
.tool{flex:1;border:1px solid var(--line);border-radius:12px;background:rgba(18,29,47,.85);color:#c6d3e3;padding:8px 6px;font-size:11px}
.tool.active{border-color:#10b981;color:#6ee7b7}
.entry{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid rgba(255,255,255,.14);background:rgba(15,23,42,.95);border-radius:18px;box-shadow:0 10px 35px #0005}
.entry input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:white;padding:0 9px;height:40px;font-size:14px}
.entry input::placeholder{color:#728198}
.send{border:0;border-radius:13px;height:40px;padding:0 17px;background:linear-gradient(135deg,#10b981,#059669);color:white;font-weight:700;font-size:13px}
.send:disabled{opacity:.45}
.note{text-align:center;color:#718198;font-size:10px;padding:7px 0 0}
button{cursor:pointer}
@media(min-width:650px){.app{max-width:520px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}body{background:#050811}.chat{height:230px}}
</style>
</head>
<body>
<div class="app">
  <div class="glow"></div>
  <header class="top">
    <div class="brand"><span class="brand-mark">✦</span><span>AI 数字人</span></div>
    <button class="creator-link" onclick="location.href='creator.html'">我的数字人＋</button><div class="status" id="status">正在检查连接</div>
  </header>

  <main class="stage">
    <canvas id="avatar"></canvas>
    <div class="hint" id="avatarHint">你好！我是你的 AI 数字人，随时可以和我聊天。</div>
    <div class="avatar-actions" aria-label="数字人动作控制"><button class="avatar-action active" data-mode="idle">待机</button><button class="avatar-action" data-mode="happy">开心</button><button class="avatar-action" data-mode="thinking">思考</button><button class="avatar-action" data-mode="wave">挥手</button></div>
  </main>

  <section class="chat" id="chat" aria-live="polite">
    <div class="chat-head"><span>对话记录</span><button class="clear" id="clearBtn">清空记录</button></div>
    <div id="messages">
      <div class="msg"><div class="avatar-mini">✦</div><div class="bubble">你好！我已经准备好了。你可以打字，或点击语音输入和我交流。</div></div>
    </div>
  </section>

  <footer class="composer">
    <div class="tools">
      <button class="tool" id="voiceBtn">🎙️ 语音输入</button>
      <button class="tool active" id="speakBtn">🔊 自动朗读：开</button>
      <button class="tool" id="stopBtn">◼ 停止朗读</button>
    </div>
    <form class="entry" id="chatForm">
      <input id="prompt" type="text" maxlength="4000" autocomplete="off" placeholder="输入你想聊的内容…" />
      <button class="send" id="sendBtn" type="submit">发送</button>
    </form>
    <div class="note">由 DeepSeek 提供智能回复 · API 密钥保存在服务器端</div>
  </footer>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $("avatar"), ctx = canvas.getContext("2d");
  const messagesEl = $("messages"), chatEl = $("chat");
  let history = [], speaking = false, busy = false, autoSpeak = true, listening = false, tick = 0;
  let avatarMode = "idle", blinkUntil = 0, nextBlink = 2.5, waveUntil = 0;
  let recognition = null;

  function setAvatarMode(mode, hint) {
    avatarMode = mode;
    document.querySelectorAll(".avatar-action").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
    if (hint) $("avatarHint").textContent = hint;
    if (mode === "wave") waveUntil = performance.now() + 1900;
  }
  document.querySelectorAll(".avatar-action").forEach(button => button.addEventListener("click", () => {
    const mode = button.dataset.mode;
    setAvatarMode(mode, ({idle:"我在这里，随时可以聊天。",happy:"见到你真开心！",thinking:"让我认真想一想…",wave:"你好呀！很高兴见到你！"})[mode]);
    if (mode === "wave") setTimeout(() => { if (avatarMode === "wave") setAvatarMode("idle", "我在这里，随时可以聊天。"); }, 2000);
  }));

  try { history = JSON.parse(localStorage.getItem("avatar-chat-history") || "[]"); } catch { history = []; }
  history = Array.isArray(history) ? history.filter(x => x && ["user","assistant"].includes(x.role) && typeof x.content === "string").slice(-20) : [];

  function save() { try { localStorage.setItem("avatar-chat-history", JSON.stringify(history.slice(-20))); } catch {} }
  function addMessage(role, content) {
    const row = document.createElement("div");
    row.className = "msg " + (role === "user" ? "user" : "");
    if (role !== "user") {
      const mini = document.createElement("div"); mini.className = "avatar-mini"; mini.textContent = "✦"; row.appendChild(mini);
    }
    const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.textContent = content;
    row.appendChild(bubble); messagesEl.appendChild(row); chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }
  function renderHistory() {
    messagesEl.innerHTML = "";
    if (!history.length) addMessage("assistant", "你好！我已经准备好了。你可以打字，或点击语音输入和我交流。");
    history.forEach(m => addMessage(m.role, m.content));
  }
  renderHistory();

  async function checkServer() {
    try {
      const r = await fetch("/api/health");
      const d = await r.json();
      $("status").textContent = d.configured ? "DeepSeek 已连接" : "等待配置 API Key";
      $("status").classList.toggle("online", !!d.configured);
    } catch {
      $("status").textContent = "服务器未连接";
      $("status").classList.remove("online");
    }
  }
  checkServer();

  function speak(text) {
    if (!autoSpeak || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "zh-CN"; utter.rate = 1; utter.pitch = 1;
    utter.onstart = () => { speaking = true; setAvatarMode("speaking", "我正在回答你…"); };
    utter.onend = utter.onerror = () => { speaking = false; setAvatarMode("idle", "你可以继续和我聊天。"); };
    speechSynthesis.speak(utter);
  }

  async function send(text) {
    text = (text || $("prompt").value).trim();
    if (!text || busy) return;
    $("prompt").value = "";
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    speaking = false;
    history.push({ role: "user", content: text });
    history = history.slice(-20); save(); renderHistory();
    busy = true; $("sendBtn").disabled = true; setAvatarMode("thinking", "正在思考…");
    const pending = addMessage("assistant", "正在思考，请稍候…");
    try {
      const response = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "请求失败，请稍后重试。");
      const reply = data.reply || "这次没有收到文字回复。";
      pending.textContent = reply;
      history.push({ role: "assistant", content: reply });
      history = history.slice(-20); save();
      $("avatarHint").textContent = "回答完成，期待你的下一句话。";
      speak(reply);
    } catch (err) {
      pending.textContent = "连接失败：" + err.message;
      $("avatarHint").textContent = "连接出现问题，请检查服务器配置。";
      // 移除本轮失败的用户消息，避免下次重复提交上下文
      history.pop(); save();
    } finally {
      busy = false; $("sendBtn").disabled = false; chatEl.scrollTop = chatEl.scrollHeight;
    }
  }

  $("chatForm").addEventListener("submit", e => { e.preventDefault(); send(); });
  $("clearBtn").addEventListener("click", () => {
    history = []; save(); renderHistory();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    speaking = false; $("avatarHint").textContent = "聊天记录已清空。";
  });
  $("speakBtn").addEventListener("click", () => {
    autoSpeak = !autoSpeak;
    $("speakBtn").textContent = autoSpeak ? "🔊 自动朗读：开" : "🔇 自动朗读：关";
    $("speakBtn").classList.toggle("active", autoSpeak);
    if (!autoSpeak && "speechSynthesis" in window) speechSynthesis.cancel();
  });
  $("stopBtn").addEventListener("click", () => {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    speaking = false; setAvatarMode("idle", "已停止朗读。");
  });

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "zh-CN"; recognition.interimResults = true; recognition.continuous = false;
    recognition.onresult = e => {
      let text = "";
      for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript;
      $("prompt").value = text;
    };
    recognition.onend = () => { listening = false; if (!speaking && !busy) setAvatarMode("idle", "语音输入结束，可以发送识别文字。"); $("voiceBtn").classList.remove("active"); $("voiceBtn").textContent = "🎙️ 语音输入"; };
    recognition.onerror = () => { listening = false; if (!speaking && !busy) setAvatarMode("idle", "语音识别暂时不可用。"); $("voiceBtn").classList.remove("active"); $("voiceBtn").textContent = "🎙️ 语音输入"; };
    $("voiceBtn").addEventListener("click", () => {
      if (listening) { recognition.stop(); return; }
      try {
        recognition.start(); listening = true; setAvatarMode("listening", "我在听，请说话…");
        $("voiceBtn").classList.add("active"); $("voiceBtn").textContent = "⏹️ 正在聆听…";
      } catch { $("avatarHint").textContent = "语音功能暂时无法启动，请稍后重试。"; }
    });
  } else {
    $("voiceBtn").addEventListener("click", () => {
      $("avatarHint").textContent = "当前浏览器不支持语音识别，请使用输入框打字。";
    });
    $("voiceBtn").textContent = "🎙️ 语音暂不可用";
  }

  function resize() {
    const rect = canvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr); canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize); resize();

  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h); tick += 0.035;
    const now = performance.now();
    if (now > nextBlink) { blinkUntil = now + 125; nextBlink = now + 2300 + Math.random() * 2600; }
    const blinking = now < blinkUntil;
    const cx = w / 2, bob = Math.sin(tick * 1.4) * (avatarMode === "idle" ? 3 : 1.5);
    const cy = h * 0.43 + bob;
    const scale = Math.min(1, w / 360, h / 340);
    const tilt = avatarMode === "thinking" ? -0.055 : avatarMode === "happy" ? 0.035 : Math.sin(tick * .7) * .012;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.rotate(tilt);
    // 呼吸光環
    ctx.strokeStyle = avatarMode === "happy" ? "rgba(250,204,21,.25)" : "rgba(45,212,191,.16)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 25, 112 + Math.sin(tick)*3, 142, 0, 0, Math.PI*2); ctx.stroke();
    // 肩膀与身体
    const body = ctx.createLinearGradient(-100,100,100,240); body.addColorStop(0,"#29496b"); body.addColorStop(1,"#10263d");
    ctx.fillStyle = body; ctx.beginPath(); ctx.moveTo(-105,190); ctx.quadraticCurveTo(-92,105,-48,112); ctx.quadraticCurveTo(0,135,48,112); ctx.quadraticCurveTo(92,105,105,190); ctx.quadraticCurveTo(0,230,-105,190); ctx.fill();
    // 挥手动作（右侧手臂）
    if (avatarMode === "wave" && now < waveUntil) {
      const wave = Math.sin(tick * 13) * .38;
      ctx.save(); ctx.translate(73,119); ctx.rotate(-1.15 + wave);
      ctx.strokeStyle = "#d99b83"; ctx.lineWidth = 17; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(0,12); ctx.lineTo(15,-43); ctx.stroke();
      ctx.fillStyle = "#efb69d"; ctx.beginPath(); ctx.arc(17,-51,10,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // 脖子与耳朵
    ctx.fillStyle="#d99b83"; ctx.fillRect(-18,72,36,42);
    ctx.fillStyle="#efb69d"; ctx.beginPath(); ctx.ellipse(-66,4,13,22,0,0,Math.PI*2); ctx.ellipse(66,4,13,22,0,0,Math.PI*2); ctx.fill();
    // 脸部
    const skin=ctx.createLinearGradient(-60,-70,60,80); skin.addColorStop(0,"#ffe0ca"); skin.addColorStop(1,"#d99b83");
    ctx.fillStyle=skin; ctx.beginPath(); ctx.ellipse(0,0,64,82,0,0,Math.PI*2); ctx.fill();
    // 头发与刘海
    ctx.fillStyle="#18253a"; ctx.beginPath(); ctx.moveTo(-65,0); ctx.quadraticCurveTo(-78,-92,-8,-91); ctx.quadraticCurveTo(62,-100,68,-28); ctx.quadraticCurveTo(35,-56,5,-48); ctx.quadraticCurveTo(-20,-28,-65,-35); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-61,-40); ctx.quadraticCurveTo(-22,-72,2,-48); ctx.quadraticCurveTo(25,-70,55,-42); ctx.quadraticCurveTo(28,-35,9,-25); ctx.quadraticCurveTo(-12,-42,-28,-23); ctx.quadraticCurveTo(-48,-20,-61,-40); ctx.fill();
    // 眼睛：眨眼、思考时看向上方
    const eyeH = blinking ? .8 : 5.2, gazeY = avatarMode === "thinking" ? -5 : 0;
    ctx.fillStyle="#263449"; ctx.beginPath(); ctx.ellipse(-23,-3+gazeY,5.2,eyeH,0,0,Math.PI*2); ctx.ellipse(23,-3+gazeY,5.2,eyeH,0,0,Math.PI*2); ctx.fill();
    // 眉毛表情
    ctx.strokeStyle="#29354a"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.beginPath();
    if (avatarMode === "happy") { ctx.arc(-23,-12,9,Math.PI*1.08,Math.PI*1.92); ctx.arc(23,-12,9,Math.PI*1.08,Math.PI*1.92); }
    else { ctx.moveTo(-32,-17); ctx.lineTo(-14,-17); ctx.moveTo(14,-17); ctx.lineTo(32,-17); }
    ctx.stroke();
    // 腮红
    ctx.fillStyle= avatarMode === "happy" ? "rgba(239,68,68,.32)" : "rgba(226,120,120,.18)"; ctx.beginPath(); ctx.ellipse(-42,25,11,6,0,0,Math.PI*2); ctx.ellipse(42,25,11,6,0,0,Math.PI*2); ctx.fill();
    // 嘴型：说话时连续开合，开心时微笑
    if (speaking) { ctx.fillStyle="#9f3e4e"; ctx.beginPath(); ctx.ellipse(0,39,8,3+Math.abs(Math.sin(tick*8))*12,0,0,Math.PI*2); ctx.fill(); }
    else if (avatarMode === "happy") { ctx.strokeStyle="#9f3e4e"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,31,13,.15,Math.PI-.15); ctx.stroke(); }
    else { ctx.strokeStyle="#9f3e4e"; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(-7,40); ctx.quadraticCurveTo(0,43,7,40); ctx.stroke(); }
    // 聆听状态的声波提示
    if (avatarMode === "listening") { ctx.strokeStyle="rgba(52,211,153,.8)"; ctx.lineWidth=2; for(let i=0;i<3;i++){ const r=83+i*9+Math.sin(tick*4+i)*2; ctx.beginPath(); ctx.arc(0,12,r,-.65,.65); ctx.stroke(); } }
    ctx.restore();
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
