name: Worker source checks and production deploy

on:
  push:
    branches:
      - "1主要的"
    paths:
      - "worker.js"
      - "functions/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".assetsignore"
      - "index.html"
      - "scripts/**"
      - ".github/workflows/worker-syntax.yml"
  pull_request:
    paths:
      - "worker.js"
      - "functions/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".assetsignore"
      - "index.html"
      - "scripts/**"
      - ".github/workflows/worker-syntax.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查 Worker 和 API 语法
        run: |
          node --check worker.js
          node scripts/check-index-inline.mjs
          find functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: 检查 Wrangler 配置
        run: node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc', 'utf8')); console.log('wrangler.jsonc OK')"
      - name: 检查公开资源排除规则
        run: |
          grep -qx 'functions/' .assetsignore
          grep -qx 'worker.js' .assetsignore
          grep -qx 'WORKER_DEPLOYMENT.md' .assetsignore
          grep -qx 'scripts/' .assetsignore

  deploy-production:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/1主要的'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出生产分支
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查 Cloudflare 部署凭证
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少 GitHub Actions Secret: CLOUDFLARE_API_TOKEN。请在仓库 Settings → Secrets and variables → Actions 添加 Cloudflare API Token。"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 GitHub Actions Secret: CLOUDFLARE_ACCOUNT_ID。请添加 Cloudflare Account ID。"
            exit 1
          fi
      - name: 安装固定版本 Wrangler
        run: npm install --no-save wrangler@4.166.0
      - name: 部署 Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
